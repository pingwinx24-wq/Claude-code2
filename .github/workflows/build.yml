name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (core + app)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Assemble debug + release
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: shade-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
